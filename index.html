<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Music Player | CodeAlpha</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

    <main class="music-app">

        <!-- =========================
             LEFT / PLAYER SECTION
        ========================== -->

        <section class="player-section">

            <header class="player-header">
                <div>
                    <p class="small-title">NOW PLAYING</p>
                    <h1>Music Player</h1>
                </div>

                <div class="music-icon">
                    <i class="fa-solid fa-music"></i>
                </div>
            </header>


            <!-- Album Art -->

            <div class="album-wrapper">

                <div class="album-art">
                    <i class="fa-solid fa-headphones"></i>
                </div>

            </div>


            <!-- Song Information -->

            <div class="song-info">

                <h2 id="song-title">Sample Song 1</h2>

                <p id="artist-name">Sample Artist 1</p>

            </div>


            <!-- Progress -->

            <div class="progress-area">

                <span id="current-time">0:00</span>

                <input
                    type="range"
                    id="progress"
                    min="0"
                    max="100"
                    value="0"
                >

                <span id="duration">0:00</span>

            </div>


            <!-- Main Controls -->

            <div class="main-controls">

                <button id="previous" class="control-btn" title="Previous Song">
                    <i class="fa-solid fa-backward-step"></i>
                </button>

                <button id="play-pause" class="play-btn" title="Play / Pause">
                    <i class="fa-solid fa-play"></i>
                </button>

                <button id="next" class="control-btn" title="Next Song">
                    <i class="fa-solid fa-forward-step"></i>
                </button>

            </div>


            <!-- Volume -->

            <div class="volume-area">

                <i class="fa-solid fa-volume-low"></i>

                <input
                    type="range"
                    id="volume"
                    min="0"
                    max="1"
                    step="0.01"
                    value="1"
                >

                <i class="fa-solid fa-volume-high"></i>

            </div>


            <!-- Autoplay -->

            <div class="autoplay-area">

                <label>
                    <input type="checkbox" id="autoplay">

                    <span>Autoplay</span>
                </label>

            </div>


            <audio id="audio"></audio>

        </section>


        <!-- =========================
             RIGHT / PLAYLIST SECTION
        ========================== -->

        <aside class="playlist-section">

            <div class="playlist-header">

                <div>
                    <p class="small-title">YOUR MUSIC</p>
                    <h2>Playlist</h2>
                </div>

                <span id="song-count">5 Songs</span>

            </div>


            <ul id="playlist"></ul>

        </aside>

    </main>


    <script src="script.js"></script>

</body>

</html>
